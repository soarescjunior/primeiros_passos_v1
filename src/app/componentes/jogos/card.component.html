<section style="margin-top: 16px; margin-bottom: 16px;">
    <button (click)="alterarFavorito()" class="favorito-btn">
        <span>{{ card().favorito ? '\u2764' : '\u2661' }}</span>
    </button> 
    <div class="imagem">
        <img [src]="card().imagem" [alt]="card().titulo" />
    </div>
    <div class="info-livros">
        <h2 class="texto-h2">{{ card().titulo }}</h2>
        <h3 class="texto-h3">{{ card().autoria }}</h3>
    </div>
</section>
